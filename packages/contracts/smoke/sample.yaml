openapi: 3.1.0
info:
  title: Codegen smoke sample
  version: 0.0.0
  description: Smoke test 2 (spec 0009). Nullable fields and oneOf must produce compiling TS, Go, and Python.
paths:
  /payments/{id}:
    get:
      operationId: getPayment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: A payment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404':
          description: Not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        retryAfter: { type: [integer, 'null'] }
    Payment:
      type: object
      required: [id, amountKobo, method, settledAt]
      properties:
        id: { type: string }
        amountKobo: { type: integer, format: int64 }
        settledAt:
          type: [string, 'null']
          format: date-time
        note:
          type: [string, 'null']
        method:
          oneOf:
            - $ref: '#/components/schemas/CardMethod'
            - $ref: '#/components/schemas/CashMethod'
          discriminator:
            propertyName: kind
            mapping:
              card: '#/components/schemas/CardMethod'
              cash: '#/components/schemas/CashMethod'
    CardMethod:
      type: object
      required: [kind, last4]
      properties:
        kind: { type: string, const: card }
        last4: { type: string }
        brand: { type: [string, 'null'] }
    CashMethod:
      type: object
      required: [kind]
      properties:
        kind: { type: string, const: cash }
        changeKobo: { type: [integer, 'null'] }

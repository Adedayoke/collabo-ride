openapi: 3.1.0
info:
  title: Collabo Ride API
  version: 0.1.0
  description: |
    One contract for every service (spec 0009, Contract layout). Each operation is tagged with its service and its audience: public, internal, or admin. Public operations live under /v1/<service>; /internal/* and /admin/* live in this same document. Service paths are written in paths/<service>.yaml.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: public
    description: Reached by the apps through the gateway under /v1/<service>
  - name: internal
    description: Service to service on the private network
  - name: admin
    description: Ops console routes, staff role only
  - name: gateway
  - name: accounts
  - name: trip
  - name: dispatch
  - name: payments
  - name: notifications
  - name: realtime
  - name: fraud
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check. Every service serves this on its own port.
      tags:
        - internal
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from the Better Auth JWT plugin (EdDSA, 10 minute lifetime).
  schemas:
    Error:
      type: object
      description: The error body every service returns.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine readable error code, for example INVALID_PHONE or RATE_LIMITED.
        message:
          type: string
          description: Human readable explanation, safe to show the user.
        retryAfter:
          type: integer
          description: Seconds to wait before retrying. Present only on 429 responses.
    Health:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string

[project]
name = "fraud"
version = "0.1.0"
description = "Collabo Ride fraud service: Collabo match scoring and fraud flags."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.0",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.83.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
